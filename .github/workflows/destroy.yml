name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Для подтверждения выключения ввести destroy-lab'
        required: true
        type: string

jobs:
  destroy:
    if: github.event.inputs.confirm == 'destroy-lab'
    runs-on: ubuntu-latest
    environment: iac-kill
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}
      TF_VAR_db_password:   ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_username:    ${{ secrets.TF_VAR_USERNAME }}
      TF_VAR_cloud_password: ${{ secrets.TF_VAR_CLOUD_PASSWORD }}
      TF_VAR_project_id:  ${{ secrets.TF_VAR_PROJECT_ID }}
      TF_VAR_my_ip:       ${{ secrets.TF_VAR_MY_IP }}
      TF_VAR_tg_bot_token: ${{ secrets.TF_VAR_TG_BOT_TOKEN }}
      TF_VAR_tg_chat_id:  ${{ secrets.TF_VAR_TG_CHAT_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.15.5

    - name: Start terraform init
      run: terraform init

    - name: Start terraform plan to destroy
      run: terraform plan -destroy -out=tfdestroy -var-file=envs/public.auto.tfvars

    - name: Upload tfdestroy plan
      uses: actions/upload-artifact@v4
      with:
          name: tfdestroy
          path: tfdestroy
          retention-days: 7

    - name: Start terraform apply
      run: terraform apply -auto-approve tfdestroy -var-file=envs/public.auto.tfvars
    